services:
  - type: web
    name: table-tennis-manager
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: bash deployment/render_build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /health/ready/
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: table-tennis-manager-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_LANGUAGE_CODE
        value: pt-br
      - key: DJANGO_TIME_ZONE
        value: Europe/Rome
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "3600"
      - key: LEGAL_CONTROLLER_NAME
        value: Escola de Tênis de Mesa
      - key: LEGAL_CONTACT_EMAIL
        value: contato@escoladetenisdemesa.com.br
      - key: LEGAL_COUNTRY
        value: Brazil
      - key: DJANGO_EMAIL_BACKEND
        value: anymail.backends.resend.EmailBackend
      - key: DJANGO_DEFAULT_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_BILLING_ENABLED
        value: "False"
      - key: STRIPE_LIVE_MODE
        value: "False"
      - key: STRIPE_PRICE_PROFESSIONAL_MONTHLY
        value: price_1UBDAWEsVM71g2d35YM4rjLD
      - key: STRIPE_PRICE_PROFESSIONAL_YEARLY
        value: price_1UBDEJEsVM71g2d3q5g6AHUp
      - key: SUBSCRIPTION_TRIAL_ENABLED
        value: "False"
      - key: SUBSCRIPTION_TRIAL_DAYS
        value: "7"
      - key: SUBSCRIPTION_ACCESS_ENFORCED
        value: "False"

databases:
  - name: table-tennis-manager-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "18"
    databaseName: table_tennis_manager
    user: table_tennis_manager
    storageAutoscalingEnabled: true
    ipAllowList: []
