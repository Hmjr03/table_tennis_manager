<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Table Tennis Manager</title>
  <description id="description">A modern table tennis paddle and ball symbol</description>
  <defs>
    <linearGradient id="background" x1="120" y1="80" x2="900" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="paddle" x1="315" y1="235" x2="690" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF1FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="25" flood-color="#0F2D78" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#background)"/>
  <circle cx="512" cy="500" r="350" fill="#FFFFFF" opacity=".07"/>
  <g filter="url(#shadow)" transform="rotate(-35 512 512)">
    <rect x="445" y="585" width="134" height="270" rx="66" fill="#F6B94F"/>
    <rect x="468" y="610" width="88" height="205" rx="44" fill="#D99328" opacity=".5"/>
    <circle cx="512" cy="420" r="232" fill="url(#paddle)"/>
    <path d="M512 188a232 232 0 0 1 0 464Z" fill="#F04444"/>
    <path d="M512 188a232 232 0 0 1 0 464" fill="none" stroke="#D92E39" stroke-width="18" opacity=".55"/>
    <circle cx="512" cy="420" r="232" fill="none" stroke="#FFFFFF" stroke-width="18" opacity=".88"/>
  </g>
  <circle cx="760" cy="266" r="92" fill="#FFFFFF" filter="url(#shadow)"/>
  <circle cx="735" cy="240" r="24" fill="#E8F0FF"/>
</svg>
