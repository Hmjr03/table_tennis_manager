services:
  - type: web
    name: table-tennis-manager-preview
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: bash deployment/render_build.sh
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /health/ready/
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: table-tennis-manager-preview-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_LANGUAGE_CODE
        value: pt-br
      - key: DJANGO_TIME_ZONE
        value: Europe/Rome
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "3600"
      - key: LEGAL_CONTROLLER_NAME
        value: Escola de Tênis de Mesa
      - key: LEGAL_CONTACT_EMAIL
        value: contato@escoladetenisdemesa.com.br
      - key: LEGAL_COUNTRY
        value: Brazil
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DJANGO_DEFAULT_FROM_EMAIL
        value: Table Tennis Manager Preview <noreply@localhost>

databases:
  - name: table-tennis-manager-preview-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "18"
    databaseName: table_tennis_manager_preview
    user: table_tennis_manager_preview
    ipAllowList: []
