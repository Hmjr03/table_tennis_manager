<header class="site-header">

    <div class="container header-content">


        <a
            href="{% url 'home' %}"
            class="logo"
        >

            <span class="logo-icon">
                🏓
            </span>

            <span>
                Table Tennis Manager
            </span>

        </a>




        <nav class="main-nav">


            {% if user.is_authenticated %}


                <a href="{% url 'dashboard:home' %}">
                    Dashboard
                </a>



                <a href="{% url 'players:list' %}">
                    Players
                </a>



                <a href="{% url 'matches:list' %}">
                    Matches
                </a>



                <a href="{% url 'performance:dashboard' %}">
                    Performance
                </a>




                <form
                    method="post"
                    action="{% url 'accounts:logout' %}"
                    class="logout-form"
                >

                    {% csrf_token %}


                    <button
                        type="submit"
                        class="nav-button"
                    >

                        Logout

                    </button>


                </form>




            {% else %}


                <a href="{% url 'accounts:login' %}">
                    Login
                </a>


                <a
                    href="{% url 'accounts:register' %}"
                    class="nav-register"
                >
                    Register
                </a>


            {% endif %}



        </nav>


    </div>


</header>
