{% load i18n %}

<nav class="context-navigation" aria-label="{{ area_label }}">
    <a href="{{ back_url }}" class="context-back-control">
        <span class="context-back-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M19 12H5"></path>
                <path d="m11 18-6-6 6-6"></path>
            </svg>
        </span>

        <span class="context-back-copy">
            <small>{{ area_label }}</small>
            <strong>{{ back_label }}</strong>
        </span>
    </a>

    <ol class="context-breadcrumb">
        <li>{{ area_label }}</li>
        <li aria-hidden="true">/</li>
        <li aria-current="page">{{ current_label }}</li>
    </ol>
</nav>
