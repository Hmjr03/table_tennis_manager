{% load i18n static %}
{% get_current_language as CURRENT_LANGUAGE %}
<!DOCTYPE html>
<html lang="{{ CURRENT_LANGUAGE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>{% translate "You are offline" %} | Table Tennis Manager</title>
    <link rel="icon" href="{% static 'icons/favicon-32.png' %}">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f7fc; color: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { width: min(520px, 100%); padding: 44px; border: 1px solid #dce3ee; border-radius: 28px; background: white; box-shadow: 0 22px 55px rgba(30, 64, 175, .1); text-align: center; }
        img { width: 82px; height: 82px; border-radius: 22px; }
        h1 { margin: 24px 0 12px; font-size: clamp(2rem, 8vw, 3rem); }
        p { margin: 0 0 28px; color: #64748b; line-height: 1.65; }
        button { min-height: 50px; padding: 12px 24px; border: 0; border-radius: 14px; background: #2563eb; color: white; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="{% static 'icons/icon-192.png' %}" alt="">
        <h1>{% translate "You are offline" %}</h1>
        <p>{% translate "Your private information was not stored offline. Reconnect to the internet to securely access your account." %}</p>
        <button type="button" onclick="window.location.reload()">{% translate "Try again" %}</button>
    </main>
</body>
</html>
